<html lang="en">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pattern Ruler Calc</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#f1e5c4"/>
  <link rel="icon" href="/icon-192.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>

  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="RulerCalc"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{
      background:#f1e5c4;
      height:100%;
      overflow:hidden;
      position:fixed;
      inset:0;
      width:100%;
      overscroll-behavior:none;
      -webkit-tap-highlight-color:transparent;
    }
    button{-webkit-tap-highlight-color:transparent;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;}
    .backspace-glyph{font-size:22px;}
    @media (pointer:coarse){
      .backspace-glyph{font-size:34px;}
    }
    .no-scrollbar::-webkit-scrollbar{display:none;}
    .app-shell{height:100vh;height:100dvh;}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ── Math helpers ─────────────────────────────────── */
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));

    function parseNum(s) {
      const str = (s || "").trim();
      if (!str) return null;
      const neg = str.startsWith("-");
      const body = neg ? str.slice(1).trim() : str;
      let val = null;
      if (/^\d*\.?\d+$/.test(body)) val = parseFloat(body);
      else if (/^\d+\/\d+$/.test(body)) {
        const [n, d] = body.split("/").map(Number);
        val = d === 0 ? null : n / d;
      } else {
        const m = body.match(/^(\d+)\s+(\d+)\/(\d+)$/);
        if (m) {
          const [w, n, d] = m.slice(1).map(Number);
          val = d === 0 ? null : w + n / d;
        }
      }
      return val == null ? null : (neg ? -val : val);
    }

    function toT(v) { return v != null ? Math.round(v * 16) : null; }

    function fmtFrac(t) {
      if (t == null) return "—";
      if (t < 0) return `−${fmtFrac(-t)}`;
      const w = Math.floor(t / 16), r = t % 16;
      if (r === 0) return `${w}"`;
      const g = gcd(r, 16);
      return w > 0 ? `${w} ${r/g}/${16/g}"` : `${r/g}/${16/g}"`;
    }

    function fmtFracExpr(t) {
      if (t == null) return "";
      if (t < 0) return `−${fmtFracExpr(-t)}`;
      const w = Math.floor(t / 16), r = t % 16;
      if (r === 0) return `${w}`;
      const g = gcd(r, 16);
      return w > 0 ? `${w} ${r/g}/${16/g}` : `${r/g}/${16/g}`;
    }

    /* ── Small expression line (grey, top of LCD) ─────── */
    function ExprLine({ tokens, pendingInput, pendingUnit, resultExpr, showingResult }) {
      if (showingResult && resultExpr) {
        return <span style={{ fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>{resultExpr}</span>;
      }
      const items = [];
      tokens.forEach((t, i) => {
        if (t.type === "op") {
          items.push(<span key={i} style={{ margin:"0 3px" }}>{t.op}</span>);
        } else {
          items.push(
            <span key={i} style={{ whiteSpace:"nowrap" }}>
              {t.label}<span style={{ fontSize:"0.65em", verticalAlign: t.unit === "cm" ? "baseline" : "super" }}>{t.unit === "cm" ? "cm" : "″"}</span>
            </span>
          );
        }
      });
      if (pendingInput) {
        items.push(
          <span key="pending" style={{ whiteSpace:"nowrap" }}>
            {pendingInput}<span style={{ fontSize:"0.65em", verticalAlign: pendingUnit === "cm" ? "baseline" : "super" }}>{pendingUnit === "cm" ? "cm" : "″"}</span>
          </span>
        );
      }
      if (items.length === 0) return <span>&nbsp;</span>;
      return (
        <span style={{ fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>
          {items}
        </span>
      );
    }

    function calcOp(a, op, b) {
      if (a == null || b == null) return null;
      if (op === "+") return a + b;
      if (op === "−") return a - b;
      if (op === "×") return a * b;
      if (op === "÷") return b === 0 ? null : a / b;
      return null;
    }

    /* ── Visual fraction display ──────────────────────── */
    function splitTyped(raw) {
      const neg = raw.startsWith("-");
      const input = neg ? raw.slice(1) : raw;
      const prefix = neg ? "−" : "";
      if (input.includes(" ")) {
        const [wholeStr, rest = ""] = input.split(" ");
        if (rest.includes("/")) {
          const [num, den] = rest.split("/");
          return { whole: prefix + wholeStr, num, den, showFrac: true };
        }
        return { whole: prefix + wholeStr, num: rest, den: "", showFrac: true };
      }
      if (input.includes("/")) {
        const [num, den] = input.split("/");
        return { whole: prefix, num, den, showFrac: true };
      }
      return { whole: prefix + input, num: "", den: "", showFrac: false };
    }

    function TypedDisplay({ input, color, unitMark }) {
      const inchMark = unitMark && unitMark !== "cm";
      const cmMark = unitMark === "cm";
      const mark = unitMark
        ? <span style={{ fontSize:"0.55em", verticalAlign:"super" }}>{unitMark}</span>
        : null;

      if (input.includes(".") || !input) {
        return <span>{input || "0"}{mark}</span>;
      }
      const { whole, num, den, showFrac } = splitTyped(input);
      if (!showFrac) {
        return <span>{whole}{mark}</span>;
      }
      // Fraction: put ″ as superscript after the whole stacked fraction group
      return (
        <span style={{ display:"inline-block", position:"relative" }}>
          <span style={{ display:"inline-flex", alignItems:"center", gap:5 }}>
            {whole && <span>{whole}</span>}
            <span style={{ display:"inline-flex", flexDirection:"column", alignItems:"center", fontSize:"0.5em", lineHeight:1.1, fontWeight:700 }}>
              <span>{num || "·"}</span>
              <span style={{ width:"100%", height:1.5, background: color, margin:"2px 0" }}/>
              <span>{den || "·"}</span>
            </span>
          </span>
          {unitMark && <span style={{
            position:"absolute",
            top: inchMark ? "-0.1em" : undefined,
            bottom: cmMark ? "-0.1em" : undefined,
            right:"-0.55em",
            fontSize:"0.45em",
            lineHeight:1,
            fontWeight:700,
          }}>{unitMark}</span>}
        </span>
      );
    }

    /* ── Key component ────────────────────────────────── */
    function Key({ label, sub, onPress, dark, orange, muted, blue }) {
      const [pressed, setPressed] = useState(false);
      const restBg  = orange ? "#e3a55f" : blue ? "#6792b2" : dark ? "#54718b" : muted ? "#c8c7ae" : "#c8c7ae";
      const pressBg = orange ? "#bc762f" : blue ? "#4e799f" : dark ? "#495f73" : muted ? "#abad8b" : "#abad8b";
      const fg      = (muted || (!dark && !orange && !blue)) ? "#354755" : "#f1ecdc";
      const shadow  = pressed
        ? "inset 0 1px 3px rgba(0,0,0,0.25)"
        : "0 1px 2px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.08)";
      return (
        <button
          onPointerDown={() => { setPressed(true); onPress(); }}
          onPointerUp={() => setPressed(false)}
          onPointerLeave={() => setPressed(false)}
          style={{
            borderRadius:7, border:"none", cursor:"pointer",
            background: pressed ? pressBg : restBg,
            color:fg, boxShadow:shadow,
            transform: pressed ? "scale(0.96)" : "scale(1)",
            transition:"transform 0.05s, background 0.05s",
            display:"flex", flexDirection:"column",
            alignItems:"center", justifyContent:"center",
            userSelect:"none", WebkitUserSelect:"none",
            touchAction:"manipulation", padding:0,
            height:"100%", minHeight:62, gap:2,
          }}
        >
          <span className={label === "⌫" ? "backspace-glyph" : undefined} style={{ fontSize: label === "⌫" ? undefined : (label.length > 2 ? 14 : 22), fontWeight:700, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", lineHeight:1 }}>{label}</span>
          {sub && <span style={{ fontSize:8.5, opacity:0.6, fontWeight:600, letterSpacing:0.3, lineHeight:1 }}>{sub}</span>}
        </button>
      );
    }

    const CM_PER_INCH = 2.54;

    // Evaluate a token stream left-to-right (no operator precedence — sequential like a desk calc).
    // tokens: array of { type:"num", inches, label } | { type:"op", op }
    function evalTokens(tokens) {
      if (tokens.length === 0) return null;
      let acc = tokens[0].type === "num" ? tokens[0].inches : null;
      if (acc == null) return null;
      let i = 1;
      while (i < tokens.length) {
        const opTok = tokens[i];
        const numTok = tokens[i + 1];
        if (!opTok || opTok.type !== "op" || !numTok || numTok.type !== "num") break;
        const r = calcOp(acc, opTok.op, numTok.inches);
        if (r == null) return null;
        acc = r;
        i += 2;
      }
      return acc;
    }

    // Build the display string for a token stream (plain text — used for the small grey line)
    function tokensToStr(tokens, pendingInput, pendingUnit) {
      const parts = tokens.map(t => t.type === "op" ? t.op : (t.label + (t.unit === "cm" ? "cm" : "″")));
      if (pendingInput) parts.push(pendingInput + (pendingUnit === "cm" ? "cm" : "″"));
      return parts.join("  ");
    }

    // Build JSX nodes for a token stream with the unit mark shown smaller than the digits —
    // used for the big main display.
    function TokenDisplay({ tokens, pendingInput, pendingUnit }) {
      const items = [];
      tokens.forEach((t, i) => {
        if (t.type === "op") {
          items.push(<span key={i} style={{ marginRight:"8px" }}>{t.op}</span>);
        } else {
          items.push(
            <span key={i} style={{ whiteSpace:"nowrap", marginRight: t.unit === "cm" ? "6px" : 0 }}>
              {t.label}<span style={{ fontSize:"0.4em", marginLeft: t.unit === "cm" ? "2px" : 0, verticalAlign: t.unit === "cm" ? "baseline" : "super" }}>{t.unit === "cm" ? "cm" : "″"}</span>
            </span>
          );
        }
      });

      if (pendingInput) {
        const hasFrac = pendingInput.includes("/") || (pendingInput.includes(" ") && !pendingInput.includes("."));
        if (hasFrac) {
          const { whole, num, den } = splitTyped(pendingInput);
          const hasSlashChar = pendingInput.includes("/");
          const numOpacity = !num ? 0.2 : 1;
          const lineOpacity = !hasSlashChar ? 0.2 : 1;
          const denOpacity = !den ? 0.2 : 1;
          items.push(
            <span key="pending" style={{ display:"inline-flex", alignItems:"center", gap:4, position:"relative" }}>
              <span style={{ visibility: whole ? "visible" : "hidden", width: whole ? "auto" : 0, overflow:"hidden" }}>{whole || "0"}</span>
              <span style={{ display:"inline-flex", flexDirection:"column", alignItems:"center", lineHeight:1.1, fontWeight:700, fontSize:18, paddingRight: pendingUnit !== "cm" ? 10 : 0 }}>
                <span style={{ opacity:numOpacity }}>{num || "·"}</span>
                <span style={{ width:"100%", height:1.5, background:"#354755", margin:"2px 0", opacity:lineOpacity }}/>
                <span style={{ opacity:denOpacity }}>{den || "·"}</span>
              </span>
              {pendingUnit === "cm"
                ? <span style={{ fontSize:9, verticalAlign:"baseline" }}>cm</span>
                : <span style={{ fontSize:11, position:"absolute", top:0, right:0, lineHeight:1 }}>″</span>
              }
            </span>
          );
        } else {
          items.push(
            <span key="pending" style={{ whiteSpace:"nowrap", marginRight: pendingUnit === "cm" ? "6px" : 0 }}>
              {pendingInput.trim()}<span style={{ fontSize:"0.4em", marginLeft: pendingUnit === "cm" ? "2px" : 0, verticalAlign: pendingUnit === "cm" ? "baseline" : "super" }}>{pendingUnit === "cm" ? "cm" : "″"}</span>
            </span>
          );
        }
      }

      return (
        <span style={{ display:"inline-flex", alignItems:"center", gap:0, flexWrap:"nowrap" }}>
          {items}
        </span>
      );
    }

    /* ── Main App ─────────────────────────────────────── */
    function App() {
      const [tokens,   setTokens]   = useState([]);   // committed number/operator tokens
      const [input,    setInput]    = useState("");   // number currently being typed
      const [unit,     setUnit]     = useState("inch");
      const [result,   setResult]   = useState(null); // set only when = pressed (inches)
      const [resultExpr, setResultExpr] = useState(null); // frozen expression string after =

      // ── Install App (PWA) ──────────────────────────────
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstall, setShowInstall] = useState(false);
      const [showIOSHelp, setShowIOSHelp] = useState(false);
      const isIOS = typeof navigator !== "undefined" && /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = typeof window !== "undefined" &&
        (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true);

      useEffect(() => {
        if (isStandalone) return; // already installed — never show the button
        function onBeforeInstall(e) {
          e.preventDefault();
          setDeferredPrompt(e);
          setShowInstall(true);
        }
        function onInstalled() {
          setShowInstall(false);
          setDeferredPrompt(null);
        }
        window.addEventListener("beforeinstallprompt", onBeforeInstall);
        window.addEventListener("appinstalled", onInstalled);
        // iOS Safari never fires beforeinstallprompt — show the button anyway with fallback instructions
        if (isIOS) setShowInstall(true);
        return () => {
          window.removeEventListener("beforeinstallprompt", onBeforeInstall);
          window.removeEventListener("appinstalled", onInstalled);
        };
      }, []);

      async function handleInstallClick() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          setDeferredPrompt(null);
          setShowInstall(false);
        } else if (isIOS) {
          setShowIOSHelp(true);
        }
      }

      const rawInputVal = parseNum(input);
      const inputInches = rawInputVal == null ? null
        : (unit === "cm" ? rawInputVal / CM_PER_INCH : rawInputVal);

      const isTyping   = input !== "";
      const showingResult = result != null && !isTyping && tokens.length === 0;

      // Last committed number token (ignores trailing operator)
      const lastNumToken = [...tokens].reverse().find(t => t.type === "num");

      // Live value shown in decimal/cm row: typed value → result → last number entered
      const liveInches = isTyping ? inputInches
        : (result != null ? result
        : (lastNumToken ? lastNumToken.inches : null));
      const liveT = toT(liveInches);
      const exact = liveInches != null && Math.abs(liveInches * 16 - liveT) < 0.001;

      // Main (big) display: while building an expression, show the running expression string;
      // after "=" show just the result; empty shows "0".
      const mainExpr = tokensToStr(tokens, input, unit);
      const hasExprContent = tokens.length > 0 || isTyping;
      // Whether the value being typed is a fraction (so we render it stacked with · placeholders)
      const typingFraction = isTyping && unit === "inch" && (input.includes("/") || input.includes(" "));

      // Expression (grey line on top) — mirrors the building expression, or frozen after "="
      const exprLine = showingResult ? resultExpr : mainExpr;

      // helper: make a number token from current input
      function makeNumToken() {
        if (inputInches == null) return null;
        const label = unit === "cm" ? `${rawInputVal}` : fmtFracExpr(toT(inputInches));
        return { type:"num", inches: inputInches, label, unit };
      }

      function pressDigit(d) {
        if (showingResult) { setResult(null); setResultExpr(null); setTokens([]); setInput(String(d)); return; }
        setInput(v => v + String(d));
      }
      function pressDot() {
        if (showingResult) { setResult(null); setResultExpr(null); setTokens([]); setInput("0."); return; }
        if (!input.includes(".")) setInput(v => (v || "0") + ".");
      }
      function pressSlash() {
        if (unit === "cm") return;
        if (showingResult) { setResult(null); setResultExpr(null); setTokens([]); return; }
        if (!input.includes("/") && input) setInput(v => v + "/");
      }
      function pressSpace() {
        if (unit === "cm") return;
        if (showingResult) { setResult(null); setResultExpr(null); setTokens([]); return; }
        if (input && !input.includes(" ") && !input.includes("/") && !input.includes(".")) {
          setInput(v => v + " ");
        }
      }
      function toggleUnit() {
        setUnit(u => u === "inch" ? "cm" : "inch");
      }
      function pressOp(newOp) {
        if (showingResult) {
          setTokens([{ type:"num", inches: result, label: fmtFracExpr(toT(result)), unit:"inch" }, { type:"op", op:newOp }]);
          setResult(null); setResultExpr(null); setInput("");
          return;
        }
        const currentOpCount = tokens.filter(t => t.type === "op").length;
        const numTok = makeNumToken();
        if (numTok) {
          if (currentOpCount >= 7) return;
          setTokens(t => [...t, numTok, { type:"op", op:newOp }]);
          setInput("");
        } else if (tokens.length && tokens[tokens.length-1].type === "op") {
          if (currentOpCount >= 7) return;
          setTokens(t => [...t.slice(0,-1), { type:"op", op:newOp }]);
        } else if (tokens.length && tokens[tokens.length-1].type === "num") {
          if (currentOpCount >= 7) return;
          setTokens(t => [...t, { type:"op", op:newOp }]);
        }
      }
      function pressEquals() {
        const numTok = makeNumToken();
        const finalTokens = numTok ? [...tokens, numTok] : [...tokens];
        // strip a dangling trailing operator
        while (finalTokens.length && finalTokens[finalTokens.length-1].type === "op") finalTokens.pop();
        if (finalTokens.length < 1) return;
        const res = evalTokens(finalTokens);
        if (res == null) return;
        const exprStr = tokensToStr(finalTokens, "", unit);
        const rT = toT(res);
        setResult(res);
        setResultExpr(exprStr);
        setTokens([]);
        setInput("");
      }
      function pressAC() {
        setTokens([]); setInput(""); setResult(null); setResultExpr(null);
      }
      function pressBack() {
        if (showingResult) { setResult(null); setResultExpr(null); return; }
        if (input !== "") { setInput(v => v.slice(0, -1)); return; }
        // If last token is an op, remove it and restore the preceding number into input
        if (tokens.length && tokens[tokens.length-1].type === "op") {
          const prevNum = tokens[tokens.length-2];
          if (prevNum && prevNum.type === "num") {
            setTokens(t => t.slice(0, -2));
            setInput(prevNum.label);
            setUnit(prevNum.unit || "inch");
          } else {
            setTokens(t => t.slice(0, -1));
          }
          return;
        }
        // If last token is a number, remove it
        setTokens(t => t.slice(0, -1));
      }

      return (
        <div className="app-shell" style={{ overflow:"hidden", background:"#f1e5c4", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"12px 10px 12px", fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>
          <div style={{ width:"100%", maxWidth:400, background:"#dad6b9", borderRadius:20, overflow:"hidden", boxShadow:"0 2px 6px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.4)" }}>

            {/* Header */}

                style={{ height:11, width:"auto", display:"block" }}
              />
              {showInstall && (
                <button
                  onClick={handleInstallClick}
                  style={{
                    display:"flex", alignItems:"center", justifyContent:"center", gap:4,
                    background:"#252e36",
                    color:"#c9c5a7",
                    border:"none", borderRadius:6,
                    padding:"7px 12px",
                    fontSize:9.5, fontWeight:600, letterSpacing:0.3,
                    fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif",
                    cursor:"pointer",
                    boxShadow:"inset 0 1px 3px rgba(0,0,0,0.5), inset 0 -1px 0 rgba(255,255,255,0.06)",
                  }}
                >
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#c9c5a7" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 3v13"/>
                    <path d="M7 11l5 5 5-5"/>
                    <path d="M4 20h16"/>
                  </svg>
                  Install App
                </button>
              )}
            </div>

            {showIOSHelp && (
              <div
                onClick={() => setShowIOSHelp(false)}
                style={{
                  position:"fixed", inset:0, background:"rgba(0,0,0,0.4)",
                  display:"flex", alignItems:"flex-end", justifyContent:"center",
                  zIndex:50,
                }}
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  style={{
                    background:"#e6e3d1", borderRadius:"18px 18px 0 0",
                    padding:"22px 24px 28px", width:"100%", maxWidth:400,
                    fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif",
                  }}
                >
                  <div style={{ fontSize:14, fontWeight:700, color:"#354755", marginBottom:12 }}>
                    Add to Home Screen
                  </div>
                  <div style={{ fontSize:12.5, color:"#354755", lineHeight:1.7 }}>
                    1. Tap the <strong>Share</strong> button
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#354755" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign:"middle", margin:"0 2px" }}>
                      <path d="M12 3v13"/><path d="M7 6l5-5 5 5"/><rect x="4" y="10" width="16" height="11" rx="2"/>
                    </svg>
                    at the bottom of Safari<br/>
                    2. Scroll down and tap <strong>"Add to Home Screen"</strong><br/>
                    3. Tap <strong>"Add"</strong> in the top right
                  </div>
                  <button
                    onClick={() => setShowIOSHelp(false)}
                    style={{
                      marginTop:18, width:"100%", height:42, borderRadius:8, border:"none",
                      background:"#354755", color:"#f1ecdc", fontSize:13, fontWeight:700,
                      cursor:"pointer", fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif",
                    }}
                  >
                    Got it
                  </button>
                </div>
              </div>
            )}

            {/* LCD */}
            <div style={{ margin:"0 12px 14px", background:"#c9c5a7", borderRadius:6, padding:"8px 16px", height:108, border:"1px solid #afa891", boxShadow:"inset 0 1px 4px rgba(0,0,0,0.14), inset 0 -1px 0 rgba(255,255,255,0.25)", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
              <div style={{ fontSize:15, color:"#8599a3", fontWeight:600, textAlign:"right", lineHeight:1.2 }}>
                <ExprLine tokens={tokens} pendingInput={input} pendingUnit={unit} resultExpr={resultExpr} showingResult={showingResult}/>
              </div>
              <div style={{ textAlign:"right", overflow:"hidden" }}>
                <span style={{ fontSize: mainExpr.length > 20 ? 22 : mainExpr.length > 14 ? 27 : 36, fontWeight:700, color:"#354755", fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", letterSpacing:-0.5, lineHeight:1, whiteSpace:"nowrap" }}>
                  {showingResult
                    ? fmtFrac(toT(result))
                    : hasExprContent
                      ? <TokenDisplay tokens={tokens} pendingInput={input} pendingUnit={unit}/>
                      : "0"}
                </span>
              </div>
              <div style={{ display:"flex", justifyContent:"flex-end", gap:12 }}>
                {(liveInches != null && !exact) && <span style={{ fontSize:9.5, color:"#df9748", fontWeight:700 }}>≈</span>}
                <span style={{ fontSize:10.5, color: liveInches != null ? "#6d859a" : "transparent", fontWeight:600, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>
                  {liveInches != null ? (liveT/16).toFixed(3)+"″" : "0.000″"}
                </span>
                <span style={{ fontSize:10.5, color: liveInches != null ? "#5d7792" : "transparent", fontWeight:700, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>
                  {liveInches != null ? (liveT/16*CM_PER_INCH).toFixed(2)+" cm" : "0.00 cm"}
                </span>
              </div>
            </div>

            {/* Keypad */}
            <div style={{ padding:"0 12px 14px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gridAutoRows:"62px", gap:7 }}>
                <Key label="⌫" dark onPress={pressBack}/>
                <Key label="AC" dark  onPress={pressAC}/>
                <Key label={unit === "inch" ? "inch" : "cm"} orange={unit === "cm"} muted={unit === "inch"} onPress={toggleUnit}/>
                <Key label="÷"  blue  onPress={() => pressOp("÷")}/>
                <Key label="7"  onPress={() => pressDigit(7)}/>
                <Key label="8"  onPress={() => pressDigit(8)}/>
                <Key label="9"  onPress={() => pressDigit(9)}/>
                <Key label="×"  blue  onPress={() => pressOp("×")}/>
                <Key label="4"  onPress={() => pressDigit(4)}/>
                <Key label="5"  onPress={() => pressDigit(5)}/>
                <Key label="6"  onPress={() => pressDigit(6)}/>
                <Key label="−"  blue  onPress={() => pressOp("−")}/>
                <Key label="1"  onPress={() => pressDigit(1)}/>
                <Key label="2"  onPress={() => pressDigit(2)}/>
                <Key label="3"  onPress={() => pressDigit(3)}/>
                <Key label="+"  blue  onPress={() => pressOp("+")}/>
                <Key label="."  onPress={pressDot}/>
                <Key label="0"  onPress={() => pressDigit(0)}/>
                <Key label="/"  onPress={pressSlash}/>
                <Key label="="  orange onPress={pressEquals}/>
              </div>
              <div style={{ marginTop:7 }}>
                <button onPointerDown={pressSpace} style={{ width:"100%", height:52, borderRadius:7, border:"none", background:"#c8c7ae", color:"#354755", fontSize:12, fontWeight:700, cursor:"pointer", letterSpacing:4, touchAction:"manipulation", boxShadow:"0 1px 2px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.35)" }}>
                  SPACE
                </button>
              </div>
            </div>

            {/* Footer */}
            <div style={{ padding:"10px 18px 10px" }}>
              <div style={{ display:"flex", justifyContent:"center", gap:40, flexWrap:"wrap", marginBottom:10 }}>
                <a href="https://reunitedone.com/pages/about" target="_blank" rel="noopener noreferrer" style={{ fontSize:9, color:"#6b675c", fontWeight:400, letterSpacing:1, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", textDecoration:"none" }}>About</a>
                <a href="https://reunitedone.com/collections/men" target="_blank" rel="noopener noreferrer" style={{ fontSize:9, color:"#6b675c", fontWeight:400, letterSpacing:1, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", textDecoration:"none" }}>Shop</a>
                <a href="https://www.instagram.com/reunited.one/" target="_blank" rel="noopener noreferrer" style={{ fontSize:9, color:"#6b675c", fontWeight:400, letterSpacing:1, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", textDecoration:"none" }}>Instagram</a>
                <a href="https://www.youtube.com/@ReunitedOne" target="_blank" rel="noopener noreferrer" style={{ fontSize:9, color:"#6b675c", fontWeight:400, letterSpacing:1, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif", textDecoration:"none" }}>Youtube</a>
              </div>
              <div style={{ textAlign:"center" }}>
                <span style={{ fontSize:9, color:"#6b675c", fontWeight:400, letterSpacing:1, fontFamily:"'Helvetica Neue', Helvetica, Arial, sans-serif" }}>Built by Reunited One</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
